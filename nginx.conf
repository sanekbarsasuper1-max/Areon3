server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- Security headers (audit finding HIGH #4) ---
  # HSTS only takes effect once a browser has actually received it over
  # HTTPS — a no-op if this container is reached over plain HTTP (e.g.
  # behind a proxy doing TLS termination that strips it), correct once
  # TLS terminates at or before this layer.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
  # style-src needs 'unsafe-inline': this app's React components use
  # inline style={{...}} extensively, which CSP treats as inline style
  # attributes — there's no practical way around this short of a full
  # nonce-based rewrite of every component, a much larger change than
  # this audit pass. connect-src/img-src/media-src are 'self' https:
  # rather than an exact allowlist because the backend origin
  # (VITE_API_URL) and the music provider's CDN domain both vary per
  # deployment and aren't known at the time this static file is
  # written — script-src/object-src/frame-ancestors are what actually
  # matter most for XSS/clickjacking and stay tight regardless.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; media-src 'self' https:; connect-src 'self' https:; font-src 'self' https: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  # React Router owns client-side routing — anything that isn't a real
  # static file falls back to index.html, or a hard refresh on e.g.
  # /profile or /draft-trainer/:id would 404 at the nginx level before
  # React Router ever gets a chance to handle it.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets can be cached aggressively — Vite fingerprints
  # filenames on build, so a new deploy naturally gets new URLs.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
